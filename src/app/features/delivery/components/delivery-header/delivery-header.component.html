<header class="driver-header">
  <div class="header-left">
    <!-- Bouton Retour si actif -->
    <a *ngIf="showBackButton && backUrl" [routerLink]="backUrl" class="btn-back-header" aria-label="Retour">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 19L8 12L15 5"/>
      </svg>
    </a>
    <button *ngIf="showBackButton && !backUrl" (click)="onBackBtnClick()" class="btn-back-header" aria-label="Retour">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 19L8 12L15 5"/>
      </svg>
    </button>

    <!-- Infos Livreur (Photo + Nom + Badge En Service) -->
    <div class="header-user">
      <div class="avatar-container">
        <img *ngIf="driverPhoto" [src]="driverPhoto" [alt]="driverName" class="avatar-img">
        <div *ngIf="!driverPhoto" class="avatar-placeholder">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round">
            <path d="M20 21C20 16.5817 16.4183 13 12 13C7.58172 13 4 16.5817 4 21"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <span class="status-indicator-dot" [class.online]="isOnDuty"></span>
      </div>

      <div class="user-meta">
        <h2 class="driver-name">{{ driverName }}</h2>
        <span class="duty-badge" [class.on-duty]="isOnDuty">
          <span class="dot-small">●</span> {{ isOnDuty ? 'EN SERVICE' : 'HORS SERVICE' }}
        </span>
      </div>
    </div>
  </div>

  <!-- Centre: Titre ou Logo AYYOU -->
  <div class="header-logo">
    <span class="logo-title">AYYOU</span>
    <span class="logo-sub">{{ title || 'LIVREUR' }}</span>
  </div>

  <!-- Droite: Bouton Cloche de Notification -->
  <div class="header-actions">
    <button class="btn-notification" aria-label="Notifications">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="notif-badge-dot"></span>
    </button>
  </div>
</header>
