<div class="stitch-validation-page">

  <!-- TOP HEADER -->
  <header class="validation-header">
    <button class="btn-back" (click)="goBack()" aria-label="Retour">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
    </button>

    <h1 class="header-title">Validation Livraison</h1>

    <button class="btn-notification" aria-label="Notifications">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="notif-badge-dot"></span>
    </button>
  </header>

  <!-- ALERTS & MESSAGES FEEDBACK -->
  <div class="alert alert-error" *ngIf="errorMessage">
    <span>{{ errorMessage }}</span>
  </div>
  <div class="alert alert-success" *ngIf="successMessage">
    <span>{{ successMessage }}</span>
  </div>

  <main class="validation-content">

    <!-- INSTRUCTION TEXT -->
    <p class="instruction-text">Scaner pour valider la livraison.</p>

    <!-- ZONE DE SCAN QR (CAMERA VIEWFINDER STITCH) -->
    <div class="scanner-card">

      <!-- Torch Button (Top Right) -->
      <button class="btn-torch" (click)="toggleTorch()" [class.active]="isTorchOn" aria-label="Lampe torche">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12" *ngIf="isTorchOn"/>
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" *ngIf="!isTorchOn"/>
        </svg>
      </button>

      <!-- Viewfinder Box with Real Video Stream -->
      <div class="viewfinder-box">
        <video #videoElement autoplay playsinline muted class="camera-feed" *ngIf="hasCameraPermission"></video>

        <!-- Red Corner Framing Brackets -->
        <div class="corner-bracket top-left"></div>
        <div class="corner-bracket top-right"></div>
        <div class="corner-bracket bottom-left"></div>
        <div class="corner-bracket bottom-right"></div>

        <!-- Laser Scanning Line -->
        <div class="laser-scan-line" *ngIf="hasCameraPermission && !isDeliveryCompleted && !validatingBackend"></div>

        <!-- Center Target Dot -->
        <div class="target-center-dot"></div>

        <!-- Camera Permission Error Overlay -->
        <div class="camera-error-overlay" *ngIf="cameraError">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#F87171" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <p class="error-msg">{{ cameraError }}</p>
          <button class="btn-retry-camera" (click)="initCamera()">Réessayer la caméra</button>
        </div>
      </div>

      <!-- Bottom Pill Badge Overlay -->
      <div class="scan-pill-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>Cadrez le QR Code du client</span>
      </div>

    </div>

    <!-- MAIN ACTION BUTTON : VALIDER LA LIVRAISON -->
    <button
      class="btn-validate-main"
      [disabled]="(!scannedQrToken && !delivery?.token_qr) || validatingBackend || isDeliveryCompleted"
      [class.active]="scannedQrToken || delivery?.token_qr"
      (click)="manualValidateClick()"
    >
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" *ngIf="!validatingBackend">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <span *ngIf="!validatingBackend && !isDeliveryCompleted">✓ Valider la livraison</span>
      <span *ngIf="validatingBackend">Vérification du QR Code...</span>
      <span *ngIf="isDeliveryCompleted">✓ Livraison Validée</span>
    </button>

  </main>

  <!-- BOTTOM NAVIGATION -->
  <app-delivery-bottom-nav></app-delivery-bottom-nav>

</div>
