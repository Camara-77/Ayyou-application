<div class="login-page">
  <!-- Culinary Background Image -->
  <img src="assets/branding/login-bg.jpg" alt="AYYOU Background" class="bg-image" />
  <div class="bg-overlay"></div>

  <!-- Top Glassmorphic Back Button -->
  <button type="button" class="btn-back-glass" (click)="onBack()" aria-label="Retour">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M15 19L8 12L15 5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- Main Glassmorphic Card Container -->
  <main class="login-card-container">
    <div class="glass-card">
      <h1 class="card-title">Connexion</h1>
      <p class="card-subtitle">Bienvenue ! Connectez-vous à votre compte.</p>

      @if (errorMessage) {
        <div class="error-banner">{{ errorMessage }}</div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <!-- Email / Identifier Input -->
        <div class="glass-input-group">
          <input
            type="text"
            class="glass-input"
            placeholder="email"
            formControlName="identifier"
            [class.input-error]="isIdentifierInvalid"
          />
          <div class="input-icon-right">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 21V19C20 16.7909 18.2091 15 16 15H8C5.79086 15 4 16.7909 4 19V21" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
              <circle cx="12" cy="7" r="4" stroke="#FFFFFF" stroke-width="2"/>
            </svg>
          </div>
        </div>

        <!-- Password Input -->
        <div class="glass-input-group">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="glass-input"
            placeholder="Mot de passe"
            formControlName="password"
            [class.input-error]="isPasswordInvalid"
          />
          <button type="button" class="btn-toggle-eye" (click)="togglePasswordVisibility()" aria-label="Afficher/masquer le mot de passe">
            <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
              <line x1="1" y1="1" x2="23" y2="23" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="#FFFFFF" stroke-width="2"/>
              <circle cx="12" cy="12" r="3" stroke="#FFFFFF" stroke-width="2"/>
            </svg>
          </button>
        </div>

        <!-- Options Row -->
        <div class="options-row">
          <label class="remember-checkbox-label">
            <input type="checkbox" class="remember-checkbox" checked />
            <span class="custom-check-box"></span>
            <span class="remember-text">Se souvenir de moi</span>
          </label>
          <a (click)="onForgotPassword()" class="forgot-link">Oublié ?</a>
        </div>

        <!-- Primary Submit Button -->
        <button type="submit" class="btn-submit-gradient" [disabled]="loading">
          <span *ngIf="!loading">Se connecter</span>
          <span *ngIf="loading" class="spinner"></span>
        </button>
      </form>

      <!-- Divider -->
      <div class="divider-row">
        <span class="divider-line"></span>
        <span class="divider-text">OU</span>
        <span class="divider-line"></span>
      </div>

      <!-- Google Social Login Button -->
      <button type="button" class="btn-google-glass" (click)="onSocialLogin('google')">
        <svg class="google-icon" width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.24 21.36 7.35 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.18 0 10.02 0 12s.46 3.82 1.26 5.42l4.02-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.24 2.64 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Continuer avec Google</span>
      </button>

      <!-- Signup Prompt -->
      <p class="signup-prompt">
        Pas encore de compte ? <a routerLink="/register" class="signup-link">S'inscrire</a>
      </p>

      <!-- Signature -->
      <div class="card-footer-divider"></div>
      <p class="signature-text">AYYOU • SAVEURS & GRILLADES</p>
    </div>
  </main>

  <!-- Screen Footer -->
  <footer class="screen-footer">
    <a routerLink="/privacy">Confidentialité</a>
    <span class="bullet">•</span>
    <a routerLink="/terms">Conditions</a>
    <span class="bullet">•</span>
    <a routerLink="/support">Support</a>
  </footer>
</div>
