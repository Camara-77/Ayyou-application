<div class="auth-input" [class.auth-input--error]="isError || errorMessage">
  @if (label || rightLinkLabel) {
    <div class="auth-input__header">
      @if (label) {
        <label [for]="inputId" class="auth-input__label">{{ label }}</label>
      }
      @if (rightLinkLabel) {
        <a href="#" (click)="onRightLinkClick($event)" class="auth-input__right-link">
          {{ rightLinkLabel }}
        </a>
      }
    </div>
  }

  <div class="auth-input__wrapper">
    <input
      [id]="inputId"
      [type]="inputType"
      [value]="value"
      [placeholder]="placeholder"
      [disabled]="disabled"
      (input)="onInput($event)"
      (blur)="onBlur()"
      class="auth-input__field"
    />

    @if (type === 'password' || icon === 'password') {
      <button
        type="button"
        (click)="togglePasswordVisibility()"
        class="auth-input__icon-btn"
        [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
      >
        @if (showPassword) {
          <!-- Eye Off SVG -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        } @else {
          <!-- Eye SVG -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        }
      </button>
    } @else if (icon === 'user') {
      <span class="auth-input__icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </span>
    }
  </div>

  @if (errorMessage) {
    <span class="auth-input__error-msg">{{ errorMessage }}</span>
  }
</div>
