<div class="users-page-container">
  <!-- Top Page Header -->
  <div class="page-title-wrap">
    <h1 class="main-title">Utilisateurs</h1>
    <p class="subtitle">
      Gestion de la base de données utilisateurs (clients, livreurs et commerçants partenaires de Dakar)
    </p>
  </div>

  <!-- Horizontal Stats Block -->
  <div class="mt-20">
    <app-user-stats [stats]="stats$ | async"></app-user-stats>
  </div>

  <!-- Filter Pills + Search Row -->
  <div class="mt-24">
    <app-user-filters
      (tabChange)="onTabChange($event)"
      (searchChange)="onSearchChange($event)"
    ></app-user-filters>
  </div>

  <!-- Main Grid (2/3 Table on Left, 1/3 User Details Panel on Right) -->
  <div class="users-main-grid mt-24">
    <div class="table-column">
      <app-user-table
        [users]="(users$ | async) || []"
        [selectedUser]="selectedUser$ | async"
        (selectUser)="onSelectUser($event)"
      ></app-user-table>
    </div>

    <div class="details-column">
      <app-user-details-panel
        [user]="selectedUser$ | async"
        (close)="onCloseDetails()"
        (toggleStatus)="onToggleUserStatus($event)"
      ></app-user-details-panel>
    </div>
  </div>
</div>
