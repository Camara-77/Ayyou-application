<div class="form-card-container">
  <!-- Title Header Wrap -->
  <div class="header-wrap">
    <h1 class="main-title">Connexion Administrateur</h1>
    <p class="subtitle">
      Accédez aux outils de gouvernance, régulation logistique et finances AYYOU Sénégal.
    </p>
  </div>

  <!-- Security Notice Box -->
  <div class="security-notice-box mt-20">
    <div class="shield-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E51B2A" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <span class="notice-text">
      Accès strictement réservé aux membres accrédités. Toute connexion non autorisée est tracée par IP et transmise au SOC Dakar.
    </span>
  </div>

  <!-- Main Login Form -->
  <form class="login-form mt-24" (ngSubmit)="onSubmit()">
    <!-- Email Field -->
    <div class="form-group">
      <div class="label-row">
        <label class="form-label">Identifiant professionnel ou Email</label>
        <span class="tag-domain-req">DOMAINE &#64;AYYOU.SN REQUIS</span>
      </div>

      <div class="input-wrapper">
        <span class="input-icon">&#64;</span>
        <input
          type="email"
          class="form-control"
          placeholder="mamadou.d@ayyou.sn"
          [(ngModel)]="email"
          name="email"
          required
        />
      </div>
    </div>

    <!-- Password Field -->
    <div class="form-group mt-16">
      <div class="label-row">
        <label class="form-label">Mot de passe administrateur</label>
        <button type="button" class="link-forgot" (click)="openRecovery.emit()">
          Clé de récupération / Oublié ?
        </button>
      </div>

      <div class="input-wrapper">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        <input
          [type]="showPassword ? 'text' : 'password'"
          class="form-control"
          placeholder="••••••••••••••••"
          [(ngModel)]="password"
          name="password"
          required
        />
        <button type="button" class="btn-eye-toggle" (click)="togglePasswordVisibility()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Remember device checkbox -->
    <div class="checkbox-row mt-16">
      <label class="checkbox-label">
        <input type="checkbox" [(ngModel)]="rememberDevice" name="rememberDevice" />
        <span class="checkbox-text">Mémoriser cet appareil de confiance pour 8 heures</span>
      </label>
    </div>

    <!-- Error Message Alert -->
    <div class="error-alert mt-16" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Submit Buttons -->
    <div class="actions-block mt-24">
      <button type="submit" class="btn-primary-red" [disabled]="isLoading || !email || !password">
        <span *ngIf="!isLoading">→ Se connecter à la console</span>
        <span *ngIf="isLoading">Connexion en cours...</span>
      </button>

      <button type="button" class="btn-google-sso mt-12" (click)="googleLogin.emit()">
        <svg class="google-icon" width="16" height="16" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Connexion via Google Workspace (&#64;ayyou.sn)</span>
      </button>
    </div>
  </form>
</div>
