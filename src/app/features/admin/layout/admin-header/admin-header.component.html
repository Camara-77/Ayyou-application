<header class="admin-header">
  <div class="header-left-search">
    <button type="button" class="mobile-toggle-btn" (click)="toggleMobileMenu.emit()" aria-label="Toggle menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <div class="search-bar-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input 
        type="text" 
        placeholder="Rechercher commande, commerçant, livreur, utilisateur..." 
        class="search-input"
      />
    </div>
  </div>

  <div class="header-right-meta">
    <span class="location-status">Dakar Métropole • En direct</span>
    <span class="date-tag">15 Mai 2024</span>
    
    <div class="user-avatar-circle">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
  </div>
</header>
