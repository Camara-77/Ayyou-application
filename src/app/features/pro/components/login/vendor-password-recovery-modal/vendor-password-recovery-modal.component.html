<div class="modal-backdrop" (click)="onCancel()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <button class="btn-close" (click)="onCancel()" aria-label="Fermer">✕</button>

    <ng-container *ngIf="!isSuccess; else successTemplate">
      <div class="modal-header">
        <div class="key-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E51B2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="7.5" cy="15.5" r="5.5"/>
            <path d="M21 2l-9.6 9.6"/>
            <path d="M15.5 7.5l3 3"/>
          </svg>
        </div>
        <h2 class="modal-title">Mot de passe Vendeur oublié ?</h2>
        <p class="modal-subtitle">
          Saisissez l'adresse email ou le numéro de téléphone associé à votre boutique AYYOU Pro.
        </p>
      </div>

      <form (ngSubmit)="onSubmit()" class="recovery-form">
        <div class="form-group">
          <label for="vendor-recovery-id" class="form-label">Email du commerce ou Téléphone</label>
          <input
            id="vendor-recovery-id"
            type="text"
            [(ngModel)]="identifier"
            name="recoveryIdentifier"
            class="form-input"
            placeholder="boutique&#64;ayyou.pro"
            required
            [disabled]="isLoading"
          />
        </div>

        <div *ngIf="errorMessage" class="error-banner">
          <span class="error-icon">⚠️</span>
          <span class="error-message">{{ errorMessage }}</span>
        </div>

        <div class="modal-actions">
          <button 
            type="submit" 
            class="btn-submit" 
            [disabled]="!identifier || isLoading"
          >
            <span *ngIf="!isLoading">Envoyer les instructions de réinitialisation</span>
            <span *ngIf="isLoading">Envoi en cours...</span>
          </button>

          <button type="button" class="btn-cancel" (click)="onCancel()" [disabled]="isLoading">
            Annuler
          </button>
        </div>
      </form>
    </ng-container>

    <ng-template #successTemplate>
      <div class="success-header">
        <div class="check-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <h2 class="modal-title">Demande de réinitialisation envoyée</h2>
        <p class="modal-subtitle">
          Un lien sécurisé de réinitialisation a été transmis à <strong>{{ identifier }}</strong>.
        </p>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-submit" (click)="onCancel()">
          Fermer et retourner à la connexion
        </button>
      </div>
    </ng-template>
  </div>
</div>
