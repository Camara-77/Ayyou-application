<header class="pro-header">
  <div class="header-left">
    <a *ngIf="showBackButton" [routerLink]="backUrl" class="btn-back-circle" aria-label="Retour">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 19L8 12L15 5" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <div *ngIf="!showBackButton" class="pro-identity-row">
      <div class="pro-avatar-circle">
        <img [src]="computedAvatarUrl" [alt]="computedName" class="avatar-img" />
      </div>
      <div class="pro-name-group">
        <h2 class="pro-name">{{ computedName }}</h2>
        <span class="status-badge-green" *ngIf="computedIsOpen">Ouvert</span>
        <span class="status-badge-red" *ngIf="!computedIsOpen">Fermé</span>
      </div>
    </div>
  </div>

  <div *ngIf="showBackButton && title" class="header-center">
    <h1 class="page-title">{{ title }}</h1>
    <span *ngIf="subtitle" class="page-subtitle">{{ subtitle }}</span>
  </div>

  <div class="header-right">
    <a *ngIf="rightIcon === 'bell'" routerLink="/pro/notifications" class="btn-bell-circle" aria-label="Notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 8A6 6 0 0 0 6 8C6 15 3 17 3 17H21C21 17 18 15 18 8Z" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13.73 21A2 2 0 0 1 10.27 21" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span *ngIf="unreadCount > 0" class="notif-badge-dot"></span>
    </a>
    <button *ngIf="rightIcon === 'calendar'" type="button" class="btn-bell-circle" aria-label="Calendrier">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="4" width="18" height="18" rx="2" stroke="#1A1A1A" stroke-width="2"/>
        <path d="M16 2V6M8 2V6M3 10H21" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Hamburger Menu (☰) -->
    <div class="hamburger-menu-wrapper" *ngIf="showMenu">
      <button 
        type="button" 
        class="btn-bell-circle btn-hamburger" 
        (click)="toggleMenu($event)"
        [attr.aria-expanded]="isMenuOpen" 
        [attr.aria-label]="isMenuOpen ? 'Fermer le menu du profil' : 'Ouvrir le menu du profil'"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <!-- Dropdown Menu -->
      <div class="pro-dropdown-menu" *ngIf="isMenuOpen" (click)="$event.stopPropagation()">
        <a routerLink="/pro/profile/edit" (click)="closeMenu()" class="menu-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          <span>Modifier mon profil</span>
        </a>
        <div class="menu-divider"></div>
        <button type="button" (click)="copyStoreLink()" class="menu-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span>Copier le lien de ma boutique</span>
        </button>
        <div class="menu-divider"></div>
        <a routerLink="/pro/subscription" (click)="closeMenu()" class="menu-item menu-item-pro">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00875A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>Abonnement PRO</span>
        </a>
        <div class="menu-divider"></div>
        <button type="button" (click)="onLogoutAction()" class="menu-item menu-item-logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E51A29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>Se déconnecter</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Confirmation Toast -->
  <div class="pro-toast" *ngIf="showToast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span>{{ toastMessage }}</span>
  </div>
</header>
