<header class="pro-header">
  <div class="header-left">
    <a *ngIf="showBackButton" [routerLink]="backUrl" class="btn-back-circle" aria-label="Retour">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 19L8 12L15 5" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <div *ngIf="!showBackButton" class="pro-identity-row">
      <div class="pro-avatar-circle">
        <img [src]="avatarUrl" [alt]="restaurantName" class="avatar-img" />
      </div>
      <div class="pro-name-group">
        <h2 class="pro-name">{{ restaurantName }}</h2>
        <span class="status-badge-green" *ngIf="isOpen">Ouvert</span>
        <span class="status-badge-red" *ngIf="!isOpen">Fermé</span>
      </div>
    </div>
  </div>

  <div *ngIf="showBackButton && title" class="header-center">
    <h1 class="page-title">{{ title }}</h1>
    <span *ngIf="subtitle" class="page-subtitle">{{ subtitle }}</span>
  </div>

  <div class="header-right">
    <a *ngIf="rightIcon === 'bell'" routerLink="/pro/notifications" class="btn-bell-circle" aria-label="Notifications">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 8A6 6 0 0 0 6 8C6 15 3 17 3 17H21C21 17 18 15 18 8Z" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13.73 21A2 2 0 0 1 10.27 21" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="notif-badge-dot"></span>
    </a>
    <button *ngIf="rightIcon === 'calendar'" type="button" class="btn-bell-circle" aria-label="Calendrier">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="4" width="18" height="18" rx="2" stroke="#1A1A1A" stroke-width="2"/>
        <path d="M16 2V6M8 2V6M3 10H21" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</header>
