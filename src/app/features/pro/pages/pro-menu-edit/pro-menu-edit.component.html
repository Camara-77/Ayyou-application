<div class="pro-app-layout">
  <!-- Header PRO -->
  <app-pro-header [title]="'Menu'" [showBackButton]="true" [backUrl]="'/pro/profile'"></app-pro-header>

  <main class="pro-main-content">

    <form (ngSubmit)="saveDish()" class="menu-form-container">

      <!-- CARTE PHOTO DU PLAT -->
      <div class="dish-image-card">
        <img [src]="dish.imageUrl || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80'" alt="Photo du plat" class="dish-cover-img" />
        <button type="button" class="btn-change-photo" (click)="photoInput.click()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M23 19C23 19.5304 22.7893 20.0391 22.4142 20.4142C22.0391 20.7893 21.5304 21 21 21H3C2.46957 21 1.96086 20.7893 1.58579 20.4142C1.21071 20.0391 1 19.5304 1 19V8C1 7.46957 1.21071 6.96086 1.58579 6.58579C1.96086 6.21071 2.46957 6 3 6H7L9 3H15L17 6H21C21.5304 6 22.0391 6.21071 22.4142 6.58579C22.7893 6.96086 23 7.46957 23 8V19Z" stroke="#E51A29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="13" r="4" stroke="#E51A29" stroke-width="2"/>
          </svg>
          <span>Modifier la photo</span>
        </button>
        <input #photoInput type="file" (change)="onFileSelected($event)" accept="image/*" class="file-input-hidden" />
      </div>

      <!-- NOM DU PLAT -->
      <div class="form-group">
        <div class="field-label-row">
          <label class="field-label-upper">NOM DU PLAT <span class="req-star">*</span></label>
        </div>
        <input type="text" [(ngModel)]="dish.name" name="dishName" class="form-input font-serif-bold" placeholder="Nom du plat" required />
      </div>

      <!-- CATÉGORIE -->
      <div class="form-group">
        <div class="field-label-row">
          <label class="field-label-upper">CATÉGORIE <span class="req-star">*</span></label>
          <span class="field-sub-label">1 sélectionnée</span>
        </div>
        <div class="categories-pills-row">
          <button type="button" class="category-pill" *ngFor="let cat of categories" [class.active]="selectedCategory === cat" (click)="selectCategory(cat)">
            {{ cat }}
          </button>
        </div>
      </div>

      <!-- DESCRIPTION DU PLAT -->
      <div class="form-group">
        <div class="field-label-row">
          <label class="field-label-upper">DESCRIPTION DU PLAT</label>
          <span class="field-sub-label">{{ (dish.description || '').length }}/250</span>
        </div>
        <textarea [(ngModel)]="dish.description" name="dishDescription" rows="3" maxlength="250" class="form-textarea" placeholder="Description du plat..."></textarea>
      </div>

      <!-- SECTION VARIANTES DU PLAT -->
      <section class="variants-section-block">
        <div class="variants-header-row">
          <h3 class="variants-title font-serif-bold">Variantes du plat</h3>
          <span class="badge-essentiel">ESSENTIEL</span>
        </div>
        <p class="variants-sub-text">
          Définissez les formats, leurs tarifs et la quantité allouée pour AYYOU.
        </p>

        <!-- Liste des cartes de variante -->
        <div class="variant-card" *ngFor="let v of dish.variants; let i = index">
          <div class="variant-card-header">
            <div class="variant-index-name">
              <span class="variant-num">{{ i + 1 }}</span>
              <span class="variant-title font-serif-bold">Variante {{ i + 1 }}</span>
            </div>
            <span class="format-tag" *ngIf="v.formatTag">{{ v.formatTag }}</span>
            <button type="button" class="btn-delete-icon" *ngIf="!v.formatTag && (dish.variants?.length || 0) > 1" (click)="removeVariant(i)" aria-label="Supprimer variante">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </div>

          <div class="form-group">
            <label class="field-label-upper">NOM DE LA VARIANTE</label>
            <input type="text" [(ngModel)]="v.name" [name]="'vName_' + i" class="form-input" placeholder="Ex: Classique — 1 personne" />
          </div>

          <div class="two-cols-row">
            <div class="form-group col-half">
              <label class="field-label-upper">PRIX (FCFA)</label>
              <input type="number" [(ngModel)]="v.price" [name]="'vPrice_' + i" class="form-input font-bold" />
            </div>
            <div class="form-group col-half">
              <label class="field-label-upper">QUANTITÉ AYYOU</label>
              <input type="number" [(ngModel)]="v.quantityAllocated" [name]="'vQty_' + i" class="form-input font-bold" />
            </div>
          </div>
        </div>

        <!-- Bouton Ajouter variante -->
        <button type="button" class="btn-add-variant-dashed" (click)="addVariant()">
          + Ajouter une variante
        </button>
      </section>

      <!-- BLOC DISPONIBILITÉ IMMÉDIATE -->
      <div class="availability-card-block">
        <div class="avail-info">
          <h4 class="avail-title font-serif-bold">Disponibilité immédiate <span class="dot-green">●</span></h4>
          <p class="avail-sub">Rendre ce plat visible et commandeable dès publication</p>
        </div>
        <div class="toggle-switch" [class.active]="dish.isVisiblePublic" (click)="dish.isVisiblePublic = !dish.isVisiblePublic">
          <div class="toggle-knob"></div>
        </div>
      </div>

      <!-- BOUTON D'ACTION PRINCIPAL -->
      <div class="submit-button-container">
        <button type="submit" class="btn-submit-red font-serif">
          <span>Ajouter le plat au menu</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5">
            <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

    </form>

  </main>

  <!-- Bottom Navigation PRO -->
  <app-pro-bottom-nav></app-pro-bottom-nav>
</div>
