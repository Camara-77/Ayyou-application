<div class="pro-app-layout">
  <!-- Header PRO -->
  <app-pro-header [title]="'Modifier profil'" [showBackButton]="true" [backUrl]="'/pro/profile'"></app-pro-header>

  <main class="pro-main-content">

    <!-- Bouton Mode client -->
    <div class="mode-client-wrapper">
      <a routerLink="/home" class="btn-mode-client">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 17L17 7M17 7H7M17 7V17" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Mode client</span>
      </a>
    </div>

    <form (ngSubmit)="saveProfile()" class="edit-form">

      <!-- SECTION 1: Médias & Visuels -->
      <section class="pro-card-section">
        <div class="section-title-row">
          <div class="icon-box-red">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="3" width="18" height="18" rx="3" stroke="#E51A29" stroke-width="2"/>
              <circle cx="8.5" cy="8.5" r="1.5" fill="#E51A29"/>
              <path d="M21 15L16 10L5 21" stroke="#E51A29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2 class="section-title">Médias & Visuels</h2>
        </div>

        <!-- Photo de couverture -->
        <div class="form-group">
          <label class="field-label">Photo de couverture</label>
          <div class="dropzone-box" (click)="coverFileInput.click()">
            <input #coverFileInput type="file" (change)="onFileSelected('cover', $event)" accept="image/*" class="file-input-hidden" />
            <div class="dropzone-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M23 19C23 19.5304 22.7893 20.0391 22.4142 20.4142C22.0391 20.7893 21.5304 21 21 21H3C2.46957 21 1.96086 20.7893 1.58579 20.4142C1.21071 20.0391 1 19.5304 1 19V8C1 7.46957 1.21071 6.96086 1.58579 6.58579C1.96086 6.21071 2.46957 6 3 6H7L9 3H15L17 6H21C21.5304 6 22.0391 6.21071 22.4142 6.58579C22.7893 6.96086 23 7.46957 23 8V19Z" stroke="#E51A29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="13" r="4" stroke="#E51A29" stroke-width="2"/>
              </svg>
            </div>
            <p class="dropzone-title">Glissez-déposez votre image ici</p>
            <p class="dropzone-sub">ou <span class="link-underline">parcourir les fichiers</span></p>
          </div>
        </div>

        <!-- Logo du restaurant -->
        <div class="form-group">
          <label class="field-label">Logo du restaurant</label>
          <div class="dropzone-box" (click)="logoFileInput.click()">
            <input #logoFileInput type="file" (change)="onFileSelected('logo', $event)" accept="image/*" class="file-input-hidden" />
            <div class="dropzone-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M23 19C23 19.5304 22.7893 20.0391 22.4142 20.4142C22.0391 20.7893 21.5304 21 21 21H3C2.46957 21 1.96086 20.7893 1.58579 20.4142C1.21071 20.0391 1 19.5304 1 19V8C1 7.46957 1.21071 6.96086 1.58579 6.58579C1.96086 6.21071 2.46957 6 3 6H7L9 3H15L17 6H21C21.5304 6 22.0391 6.21071 22.4142 6.58579C22.7893 6.96086 23 7.46957 23 8V19Z" stroke="#E51A29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="13" r="4" stroke="#E51A29" stroke-width="2"/>
              </svg>
            </div>
            <p class="dropzone-title">Glissez-déposez votre logo ici</p>
            <p class="dropzone-sub">ou <span class="link-underline">parcourir les fichiers</span></p>
          </div>
        </div>
      </section>

      <!-- SECTION 2: Informations Générales -->
      <section class="pro-card-section">
        <div class="section-title-row">
          <div class="icon-box-red-circle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="10" stroke="#E51A29" stroke-width="2"/>
              <line x1="12" y1="16" x2="12" y2="12" stroke="#E51A29" stroke-width="2" stroke-linecap="round"/>
              <circle cx="12" cy="8" r="1" fill="#E51A29"/>
            </svg>
          </div>
          <h2 class="section-title">Informations Générales</h2>
        </div>

        <div class="form-group">
          <label class="field-label">Nom du restaurant</label>
          <input type="text" [(ngModel)]="profile.name" name="name" class="form-input font-serif-bold" required />
        </div>

        <div class="form-group">
          <label class="field-label">Bio / À propos</label>
          <textarea [(ngModel)]="profile.description" name="description" rows="3" class="form-textarea"></textarea>
        </div>

        <div class="form-group">
          <label class="field-label">Adresse complète</label>
          <input type="text" [(ngModel)]="profile.address" name="address" class="form-input" required />
        </div>

        <div class="form-group">
          <label class="field-label">Téléphone professionnel</label>
          <input type="tel" [(ngModel)]="profile.phone" name="phone" class="form-input" required />
        </div>

        <div class="form-group">
          <label class="field-label">Types de cuisine (séparés par des virgules)</label>
          <input type="text" [(ngModel)]="cuisineTypesString" name="cuisineTypes" class="form-input" />
        </div>
      </section>

      <!-- SECTION 3: Horaires d'ouverture -->
      <section class="pro-card-section">
        <div class="section-title-row">
          <div class="icon-box-red-circle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="10" stroke="#E51A29" stroke-width="2"/>
              <path d="M12 6V12L16 14" stroke="#E51A29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2 class="section-title">Horaires d'ouverture</h2>
        </div>

        <div class="hours-list">
          <div class="hours-row" *ngFor="let item of openingHoursList; let i = index">
            <span class="hours-day">{{ item.label }}</span>
            <input type="text" [(ngModel)]="item.value" [name]="'hours_' + i" class="hours-input" />
          </div>
        </div>
      </section>

      <!-- BOUTONS D'ACTION -->
      <div class="action-buttons-row">
        <button type="button" class="btn-cancel font-serif" (click)="cancel()">
          Annuler
        </button>
        <button type="submit" class="btn-submit font-serif" [disabled]="isSaving">
          <span *ngIf="!isSaving">Enregistrer</span>
          <span *ngIf="isSaving">Enregistrement...</span>
        </button>
      </div>

    </form>

  </main>

  <!-- Navigation PRO -->
  <app-pro-bottom-nav></app-pro-bottom-nav>
</div>
