<div class="pro-app-layout">
  <!-- Header: Back button, centered two-line title AYYOU Studio, bell icon -->
  <app-pro-header [title]="'AYYOU'" [subtitle]="'Studio'" [showBackButton]="true"></app-pro-header>

  <main class="pro-main-content">

    <form (ngSubmit)="publishVideo()" class="studio-form">
      
      <!-- Section 1: CAPTUREZ VOTRE PLAT -->
      <div class="form-section">
        <label class="section-label">CAPTUREZ VOTRE PLAT</label>
        
        <div class="video-dropzone-box">
          <div class="video-overlay-content">
            <div class="btn-play-camera">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="#E51A29" xmlns="http://www.w3.org/2000/svg">
                <path d="M17 10.5V7C17 6.44772 16.5523 6 16 6H4C3.44772 6 3 6.44772 3 7V17C3 17.5523 3.44772 18 4 18H16C16.5523 18 17 17.5523 17 17V13.5L21 17.5V6.5L17 10.5Z"/>
              </svg>
            </div>
            <h3 class="zone-title">Filmer ou importer une vidéo</h3>
            <p class="zone-subtitle">Glissez votre vidéo ici ou touchez pour ouvrir la galerie</p>
          </div>
          <input type="file" accept="video/*" (change)="onFileSelected($event)" class="file-input-hidden"/>
        </div>
      </div>

      <!-- Error Message if duration or description invalid -->
      <div *ngIf="errorMessage" class="error-banner">
        {{ errorMessage }}
      </div>

      <!-- Section 2: PLAT OU PRODUIT ASSOCIÉ -->
      <div class="form-section">
        <div class="label-with-sub">
          <label class="section-label">PLAT OU PRODUIT ASSOCIÉ</label>
          <span class="sub-info">(Récupère le prix, le menu et le restaurant automatiquement)</span>
        </div>

        <div class="selected-dish-card">
          <div class="card-line-top">
            <span class="dish-title-bold">Thiéboudienne Penda Mbaye</span>
            <span class="dish-price-bold">4 500 FCFA</span>
          </div>
          <div class="card-line-bottom">
            <span>Chez Loutcha • Dakar Plateau</span>
          </div>
        </div>
      </div>

      <!-- Section 3: CATÉGORIE -->
      <div class="form-section">
        <label class="section-label">CATÉGORIE</label>
        <div class="categories-pills-row">
          <button 
            type="button" 
            class="pill-btn" 
            *ngFor="let cat of categories" 
            [class.active]="selectedCategory === cat" 
            (click)="setCategory(cat)">
            {{ cat }}
          </button>
        </div>
      </div>

      <!-- Section 4: NOM DU PRODUIT * -->
      <div class="form-group">
        <label for="productName" class="input-label">NOM DU PRODUIT <span class="required">*</span></label>
        <input 
          type="text" 
          id="productName" 
          [(ngModel)]="productName" 
          name="productName" 
          placeholder="Ex : Dibiterie d'agneau braisé, Croissant au beurre..."
        />
      </div>

      <!-- Section 5: PRIX DU PRODUIT (FCFA) * -->
      <div class="form-group">
        <label for="productPrice" class="input-label">PRIX DU PRODUIT (FCFA) <span class="required">*</span></label>
        <input 
          type="number" 
          id="productPrice" 
          [(ngModel)]="productPrice" 
          name="productPrice" 
          placeholder="Ex : 4 500"
        />
      </div>

      <!-- Section 6: DESCRIPTION -->
      <div class="form-group">
        <div class="label-row-counter">
          <label for="description" class="input-label">DESCRIPTION</label>
          <span class="char-counter">{{ description.length }}/280</span>
        </div>
        <textarea 
          id="description" 
          [(ngModel)]="description" 
          name="description" 
          rows="3" 
          maxlength="280"
          placeholder="Décrivez votre plat..."
        ></textarea>
      </div>

      <!-- Section 7: BOUTON DE PUBLICATION -->
      <button type="submit" class="btn-publish-submit" [disabled]="isUploading">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        <span>Publier maintenant</span>
      </button>

    </form>

  </main>

  <!-- Bottom Navigation -->
  <app-pro-bottom-nav></app-pro-bottom-nav>
</div>
