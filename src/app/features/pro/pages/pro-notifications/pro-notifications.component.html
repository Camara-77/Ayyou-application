<div class="pro-app-layout">
  <!-- Header PRO -->
  <app-pro-header [title]="'Notifications'" [showBackButton]="true" [backUrl]="'/pro/dashboard'"></app-pro-header>

  <main class="pro-main-content">

    <!-- Barre de Recherche -->
    <div class="search-box">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 21L15 15M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <input type="text" [(ngModel)]="searchQuery" (ngModelChange)="applyFilter()" placeholder="Plat, restaurant, burger, artisan..." />
    </div>

    <!-- En-tête de section -->
    <div class="section-label-row">
      <span class="label-title">ACTIVITÉ RÉCENTE</span>
      <span class="badge-live">En direct</span>
    </div>

    <!-- Liste des notifications -->
    <div class="notifications-list">
      <div class="notif-card" *ngFor="let item of filteredNotifications" [class.pinned]="item.isPinned" [class.unread]="!item.isRead">
        
        <!-- En-tête de Carte -->
        <div class="notif-header">
          <div class="avatar-wrap" [style.background]="item.avatarBg || '#FFF1F2'">
            <span class="avatar-text" [style.color]="item.avatarBg === '#1A1A1A' ? '#FFFFFF' : '#1A1A1A'">{{ item.avatarText }}</span>
          </div>

          <div class="header-info">
            <div class="name-status">
              <h3 class="notif-name font-serif-bold">{{ item.title }}</h3>
              <span class="badge-tag" [ngClass]="item.statusBadgeClass" *ngIf="item.statusBadgeText">{{ item.statusBadgeText }}</span>
            </div>
            <p class="notif-sub" *ngIf="item.subtitle">{{ item.subtitle }}</p>
          </div>

          <span class="notif-time">{{ item.timeFormatted }}</span>
        </div>

        <!-- Corps du message -->
        <div class="notif-body-box">
          <p class="notif-message">{{ item.message }}</p>
        </div>

        <!-- Pied de Carte -->
        <div class="notif-footer-row" *ngIf="item.footerLeftText || item.footerActionText">
          <div class="footer-left">
            <span [ngClass]="item.footerLeftClass || ''">{{ item.footerLeftText }}</span>
          </div>
          <div class="footer-right">
            <button type="button" class="action-btn" [ngClass]="item.footerActionClass || 'btn-text-link'">
              {{ item.footerActionText }}
            </button>
          </div>
        </div>

      </div>

      <!-- État vide si aucune notification trouvée -->
      <div *ngIf="filteredNotifications.length === 0" class="empty-notif-state">
        <p>Aucune notification correspondante.</p>
      </div>
    </div>

  </main>

  <!-- Bottom Navigation PRO -->
  <app-pro-bottom-nav></app-pro-bottom-nav>
</div>
