<article class="food-post" *ngIf="feedItem">
  <div class="post-media-wrapper" (click)="onMediaTap($event)">
    <!-- Media: Single Image, Video, or Multi-Image Horizontal Scroll -->
    <ng-container [ngSwitch]="feedItem.mediaType">
      <!-- Video Media (Supports up to 3 minutes duration, tap to pause/play) -->
      <video
        #videoElement
        *ngSwitchCase="'video'"
        [src]="feedItem.mediaUrl"
        [poster]="feedItem.dish?.imageUrl || ''"
        class="post-media-content"
        [muted]="isMuted"
        loop
        playsinline
        preload="metadata"
        (play)="onVideoPlay()"
        (pause)="onVideoPause()"
        (timeupdate)="onVideoTimeUpdate()"
        (ended)="onVideoEnded()"
      ></video>

      <!-- Multi-Image or Single Image -->
      <ng-container *ngSwitchCase="'image'">
        <div class="media-carousel" *ngIf="mediaList && mediaList.length > 1; else singleImg">
          <div class="carousel-track">
            <img
              *ngFor="let imgUrl of mediaList"
              [src]="imgUrl"
              [alt]="feedItem.dish.name"
              class="post-media-content carousel-item"
            />
          </div>
        </div>

        <ng-template #singleImg>
          <img
            [src]="feedItem.mediaUrl"
            [alt]="feedItem.dish.name"
            class="post-media-content"
          />
        </ng-template>
      </ng-container>
    </ng-container>

    <!-- Top-Right Sound Mute/Unmute Toggle Button -->
    <button
      *ngIf="feedItem.mediaType === 'video'"
      type="button"
      class="sound-toggle-btn"
      (click)="toggleSound($event)"
      [attr.aria-label]="isMuted ? 'Activer le son' : 'Désactiver le son'"
    >
      <!-- Unmuted Icon (Sound ON) -->
      <svg *ngIf="!isMuted" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
      <!-- Muted Icon (Sound OFF) -->
      <svg *ngIf="isMuted" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>

    <!-- Top-Center Restaurant Profile Header (Centred Avatar + Name Below) -->
    <a [routerLink]="['/restaurant', feedItem.restaurant.id]" class="restaurant-top-overlay" (click)="$event.stopPropagation()">
      <img [src]="feedItem.restaurant.avatarUrl" [alt]="feedItem.restaurant.name" class="restaurant-avatar" />
      <span class="restaurant-name">{{ feedItem.restaurant.name }}</span>
    </a>

    <!-- Right Column Interactions (Heart 1.2k, Share Partager) -->
    <div class="interactions-overlay" (click)="$event.stopPropagation()">
      <app-food-interaction
        [videoId]="feedItem.id"
        [likesCount]="feedItem.likesCount"
        [isLiked]="feedItem.isLiked || false"
        [sharesCount]="feedItem.sharesCount"
        [dishTitle]="feedItem.dish.name"
        [restaurantName]="feedItem.restaurant.name"
        (likeToggle)="onLikeToggle($event)"
        (share)="openShareModal()"
      ></app-food-interaction>
    </div>

    <!-- Bottom Overlay Content -->
    <div class="bottom-overlay" (click)="$event.stopPropagation()">
      <div class="dish-details" (click)="onDishClick($event)" style="cursor: pointer;">
        <p class="dish-description" *ngIf="feedItem.dish.description">{{ feedItem.dish.description }}</p>
        <span class="dish-price">{{ formatPrice(feedItem.dish.price) }}</span>

        <div class="action-row">
          <app-order-button
            label="Commander"
            size="medium"
            (orderClick)="onOrder($event)"
          ></app-order-button>

          <button class="btn-quick-cart" (click)="onQuickCart($event)" aria-label="Ajout rapide au panier">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 3.5h3.2l2.4 10.4a1 1 0 0 0 1 .8h10.8a1 1 0 0 0 1-.8L22 7H7.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M14 7.5v5M11.5 10h5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
              <circle cx="9.5" cy="19.5" r="1.8" fill="#FFFFFF"/>
              <circle cx="17.5" cy="19.5" r="1.8" fill="#FFFFFF"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-notification" *ngIf="toastMessage">
    <span>{{ toastMessage }}</span>
  </div>

  <!-- SHARE MODAL DIALOG (Un-clipped root overlay) -->
  <div class="share-modal-overlay" *ngIf="showShareModal" (click)="closeShareModal($event)">
    <div class="share-modal-card" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title">Partager cette vidéo</h3>
        <button class="btn-close" (click)="closeShareModal($event)" aria-label="Fermer">✕</button>
      </div>

      <div class="share-options-grid">
        <!-- WhatsApp -->
        <button class="share-option-btn" (click)="shareWhatsApp($event)">
          <div class="option-icon whatsapp">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.99c-.002 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413"/>
            </svg>
          </div>
          <span class="option-label">WhatsApp</span>
        </button>

        <!-- Telegram -->
        <button class="share-option-btn" (click)="shareTelegram($event)">
          <div class="option-icon telegram">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF">
              <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.562 8.161c-.18.717-.962 4.084-1.362 5.804-.168.727-.435.971-.693.995-.561.052-.986-.37-1.53-.726-.851-.557-1.332-.903-2.158-1.448-.954-.629-.335-.975.208-1.54.142-.148 2.613-2.396 2.661-2.601.006-.025.01-.121-.045-.17-.056-.049-.138-.032-.198-.019-.084.019-1.428.908-4.032 2.668-.381.261-.727.389-1.037.382-.341-.008-.997-.193-1.485-.352-.598-.194-1.073-.298-1.031-.628.022-.172.261-.348.716-.528 2.809-1.225 4.681-2.034 5.617-2.424 2.667-1.107 3.222-1.3 3.582-1.306.079-.001.257.018.372.112.097.079.124.186.136.262.012.076.027.248.016.388z"/>
            </svg>
          </div>
          <span class="option-label">Telegram</span>
        </button>

        <!-- Email -->
        <button class="share-option-btn" (click)="shareEmail($event)">
          <div class="option-icon email">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="3"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </div>
          <span class="option-label">Email</span>
        </button>

        <!-- Instagram -->
        <button class="share-option-btn" (click)="shareInstagram($event)">
          <div class="option-icon instagram">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
          </div>
          <span class="option-label">Instagram</span>
        </button>
      </div>

      <div class="share-divider"></div>

      <div class="secondary-actions">
        <!-- Copier le lien -->
        <button class="btn-copy-link" (click)="copyLink($event)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <span>Copier le lien</span>
        </button>
      </div>
    </div>
  </div>
</article>
