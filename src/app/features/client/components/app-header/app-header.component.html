<header class="app-header">
  <div class="header-content">
    <div class="left-section">
      <a *ngIf="showBack" [routerLink]="backUrl" class="btn-back" aria-label="Retour">
        <!-- SVG arrow-back from library -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 19L8 12L15 5" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <a *ngIf="!showBack || showLogo" routerLink="/home" class="logo-link" [class.with-back]="showBack">
        <!-- Official AYYOU SVG Brand Logo Asset -->
        <img src="assets/branding/logo.svg" alt="ÂYYOU" class="ayyou-logo-img" />
      </a>
    </div>

    <div class="title-section" *ngIf="title">
      <h1 class="header-title">{{ title }}</h1>
    </div>

    <div class="right-section">
      <a routerLink="/notifications" class="btn-icon bell-btn" aria-label="Notifications">
        <!-- SVG notifications bell from library -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 8A6 6 0 0 0 6 8C6 15 3 17 3 17H21S18 15 18 8Z" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13.73 21A2 2 0 0 1 10.27 21" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span *ngIf="notificationCount > 0" class="badge">{{ notificationCount }}</span>
      </a>
    </div>
  </div>
</header>
