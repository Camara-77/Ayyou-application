<div class="restaurant-card" *ngIf="restaurant" (click)="onCardClick()" style="cursor: pointer;">
  <div class="card-img-wrapper">
    <img [src]="restaurant.coverUrl || restaurant.logoUrl" [alt]="restaurant.name" class="card-img" />
    <span class="status-badge" [class.open]="restaurant.status === 'open'">
      <span class="dot"></span>
      {{ restaurant.status === 'open' ? 'Ouvert' : 'Fermé' }}
    </span>
  </div>

  <div class="card-info">
    <div class="info-top">
      <h4 class="restaurant-name">{{ restaurant.name }}</h4>
      <p class="tagline" *ngIf="restaurant.tagline">{{ restaurant.tagline }}</p>
      <p class="location" *ngIf="restaurant.location">{{ restaurant.location }}</p>
    </div>

    <div class="card-bottom">
      <a [routerLink]="['/restaurant', restaurant.id]" class="view-profile-btn" (click)="$event.stopPropagation()">
        Voir profil <span class="arrow">&gt;</span>
      </a>
    </div>
  </div>
</div>
