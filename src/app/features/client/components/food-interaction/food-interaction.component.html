<div class="food-interactions-column">
  <!-- Like Button -->
  <button class="interaction-btn" (click)="onLike($event)" aria-label="J'aime">
    <div class="icon-circle" [class.liked]="isLiked">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" [attr.fill]="isLiked ? '#E51A29' : 'none'" [attr.stroke]="isLiked ? '#E51A29' : '#FFFFFF'" stroke-width="2"/>
      </svg>
    </div>
    <span class="label">{{ formatCount(likesCount) }}</span>
  </button>

  <!-- Share Button -->
  <button class="interaction-btn" (click)="onShare($event)" aria-label="Partager">
    <div class="icon-circle">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="label">Partager</span>
  </button>
</div>
