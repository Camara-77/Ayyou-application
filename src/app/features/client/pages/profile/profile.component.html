<div class="page-container">
  <!-- Top Global Header -->
  <app-header></app-header>

  <main class="profile-content" *ngIf="userProfile">
    <!-- Sub-header Row -->
    <div class="profile-page-header">
      <a routerLink="/home" class="btn-back-circle" aria-label="Retour">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 19L8 12L15 5" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
      <h1 class="page-title">Mon profil</h1>
      <div class="header-spacer"></div>
    </div>

    <!-- User Info Card -->
    <div class="user-hero-card">
      <div class="avatar-wrapper">
        <img [src]="userProfile.avatarUrl" [alt]="userProfile.name" class="user-avatar" />
      </div>
      <h2 class="user-name">{{ userProfile.name }}</h2>
      <div class="location-tag">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 17C14.5 13.8 17 11.2 17 8.5C17 5.74 14.76 3.5 12 3.5C9.24 3.5 7 5.74 7 8.5C7 11.2 9.5 13.8 12 17Z" fill="#E51A29"/>
          <circle cx="12" cy="8.5" r="2.5" fill="#FFFFFF"/>
        </svg>
        <span>{{ userProfile.location }}</span>
      </div>
    </div>

    <!-- Quick Action Settings Cards -->
    <div class="settings-group">
      <!-- Notifications Toggle Row -->
      <div class="settings-card" (click)="toggleNotifications()">
        <div class="card-left">
          <div class="icon-circle icon-bell">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 8A6 6 0 0 0 6 8C6 15 3 17 3 17H21S18 15 18 8Z" stroke="#E51A29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M13.73 21A2 2 0 0 1 10.27 21" stroke="#E51A29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="card-label">Notifications</span>
        </div>
        <div class="card-right">
          <div class="toggle-switch" [class.active]="userProfile.notificationsEnabled">
            <div class="toggle-thumb"></div>
          </div>
        </div>
      </div>

      <!-- Mes favoris Row -->
      <a routerLink="/favorites" class="settings-card nav-link">
        <div class="card-left">
          <div class="icon-circle icon-heart">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" stroke="#E51A29" stroke-width="2"/>
            </svg>
          </div>
          <span class="card-label">Mes favoris</span>
        </div>
        <div class="card-right">
          <span class="chevron">&gt;</span>
        </div>
      </a>
    </div>

    <!-- Section Mon Compte -->
    <div class="account-section">
      <h3 class="section-title">Mon Compte</h3>

      <div class="account-card-group">
        <!-- Informations personnelles -->
        <a routerLink="/profile/edit" class="account-row nav-link">
          <div class="row-left">
            <div class="icon-circle icon-user">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 21V19C20 16.7909 18.2091 15 16 15H8C5.79086 15 4 16.7909 4 19V21" stroke="#757575" stroke-width="2" stroke-linecap="round"/>
                <circle cx="12" cy="7" r="4" stroke="#757575" stroke-width="2"/>
              </svg>
            </div>
            <div class="row-text">
              <span class="row-title">Informations personnelles</span>
            </div>
          </div>
          <div class="row-right">
            <span class="chevron">&gt;</span>
          </div>
        </a>

        <div class="row-divider"></div>

        <!-- Historique des commandes -->
        <a routerLink="/order-history" class="account-row nav-link">
          <div class="row-left">
            <div class="icon-circle icon-history">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 8V12L15 14" stroke="#757575" stroke-width="2" stroke-linecap="round"/>
                <circle cx="12" cy="12" r="9" stroke="#757575" stroke-width="2"/>
              </svg>
            </div>
            <div class="row-text">
              <span class="row-title">Historique des commandes</span>
              <span class="row-subtitle">Suivez vos commandes passées</span>
            </div>
          </div>
          <div class="row-right">
            <span class="chevron">&gt;</span>
          </div>
        </a>
      </div>
    </div>

    <!-- Déconnexion Button -->
    <button class="btn-logout" (click)="logout()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9" stroke="#E51A29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 17L21 12L16 7" stroke="#E51A29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 12H9" stroke="#E51A29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Déconnexion</span>
    </button>
  </main>

  <app-chatbot-floating></app-chatbot-floating>
  <app-bottom-nav activeTab="profile"></app-bottom-nav>
</div>
