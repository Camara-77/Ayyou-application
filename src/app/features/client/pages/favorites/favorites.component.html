<div class="page-container">
  <!-- Top Floating Header Overlay (Back Arrow + Title) -->
  <div class="favorites-header-overlay">
    <a routerLink="/profile" class="btn-back" aria-label="Retour au profil">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 19L8 12L15 5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <h1 class="page-title">Mes favoris</h1>
  </div>

  <main class="feed-content">
    <div class="empty-favorites" *ngIf="favorites.length === 0">
      <div class="empty-icon">❤️</div>
      <h3 class="empty-title">Aucun favori pour le moment</h3>
      <p class="empty-subtitle">Aimez des vidéos dans le Feed pour les retrouver dans vos favoris du profil.</p>
      <a routerLink="/home" class="btn-discover">Découvrir le Feed</a>
    </div>

    <app-food-post
      *ngFor="let item of favorites"
      [feedItem]="item"
      (orderDish)="onOrderDish($event)"
      (quickCart)="onQuickCart($event)"
    ></app-food-post>
  </main>

  <app-bottom-nav activeTab="profile"></app-bottom-nav>
</div>
