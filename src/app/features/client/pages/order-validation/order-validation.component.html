<div class="page-container">
  <!-- Top Global Header -->
  <app-header></app-header>

  <main class="validation-main-content">
    <!-- Sub-header Row -->
    <div class="validation-page-header">
      <button class="btn-back-circle" (click)="goBack()" aria-label="Retour">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 19L8 12L15 5" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="header-center-title">
        <h1 class="page-title">Recuperation<br>de votre commande</h1>
      </div>
    </div>

    <!-- Main QR Code Display Card -->
    <div class="qr-card">
      <span class="client-code-label">CODE CLIENT PRIORITAIRE</span>
      <h2 class="client-code-val">
        AY • {{ clientCode }}
        <svg class="shield-icon" width="20" height="22" viewBox="0 0 24 26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" fill="#E51A29"/>
        </svg>
      </h2>

      <!-- QR Code Container with Red Corner Brackets -->
      <div class="qr-box-wrapper">
        <div class="qr-corner top-left"></div>
        <div class="qr-corner top-right"></div>
        <div class="qr-corner bottom-left"></div>
        <div class="qr-corner bottom-right"></div>

        <!-- Rendered Real QR SVG -->
        <div class="qr-svg-container" [innerHTML]="qrCodeSvgContent"></div>
      </div>

      <p class="qr-instruction">
        Présentez ce code ou scannez le QR code<br>directement au comptoir de retrait.
      </p>
    </div>

    <!-- Call Restaurant Button -->
    <div class="call-btn-container">
      <a [href]="'tel:' + restaurantPhone" class="btn-call-outline">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Appeler le restaurant</span>
      </a>
    </div>

  </main>

  <app-bottom-nav activeTab="profile"></app-bottom-nav>
</div>
