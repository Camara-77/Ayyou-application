<div class="auth-modal-overlay" *ngIf="isOpen" (click)="onClose()">
  <div class="auth-modal-container" (click)="$event.stopPropagation()">
    <!-- Header Icon -->
    <div class="auth-modal-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M12 8v4"/>
        <path d="M12 16h.01"/>
      </svg>
    </div>

    <!-- Title & Subtitle -->
    <h2 class="auth-modal-title">{{ config.title || 'Connectez-vous pour continuer' }}</h2>
    <p class="auth-modal-message">{{ config.message || 'Créez un compte ou connectez-vous pour accéder à cette fonctionnalité AYYOU.' }}</p>

    <!-- Actions -->
    <div class="auth-modal-actions">
      <button type="button" class="btn-primary" (click)="onLogin()">
        {{ config.confirmText || 'Se connecter' }}
      </button>

      <button type="button" class="btn-secondary" (click)="onRegister()">
        {{ config.registerText || 'Créer un compte' }}
      </button>

      <button type="button" class="btn-ghost" (click)="onClose()">
        {{ config.cancelText || 'Continuer à explorer' }}
      </button>
    </div>
  </div>
</div>
